name: Send Feishu AI Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/feishu-daily.yml"
  workflow_run:
    workflows: ["Update AI News Snapshot"]
    types: [completed]
  schedule:
    # GitHub Actions cron uses UTC and scheduled runs may be delayed or dropped.
    # Use a focused morning window plus sparse backstops. The guard below sends
    # only on the first automatic run at/after 09:00 Beijing time each day.
    - cron: "11,31,51 1-4 * * *"
    - cron: "17 5,9,13 * * *"

concurrency:
  group: feishu-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 75
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Beijing delivery window
        id: delivery_guard
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          should_send="true"
          reason="manual dispatch"
          beijing_now="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')"
          beijing_date="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          beijing_hour="$(TZ=Asia/Shanghai date '+%H')"
          beijing_minute="$(TZ=Asia/Shanghai date '+%M')"
          beijing_second="$(TZ=Asia/Shanghai date '+%S')"

          if [ "$event" = "schedule" ] || [ "$event" = "workflow_run" ] || [ "$event" = "push" ]; then
            should_send="false"
            reason="before Beijing 09:00"

            # GitHub may deliver an update before 09:00 and then drop every
            # post-09:00 cron. Keep the 08:xx workflow_run alive until 09:00 so
            # that the already-delivered event can still close the daily loop.
            if [ "$event" = "workflow_run" ] && [ "$beijing_hour" -eq 8 ]; then
              wait_seconds=$((3600 - 10#$beijing_minute * 60 - 10#$beijing_second))
              echo "Waiting ${wait_seconds}s for Beijing 09:00 delivery window"
              sleep "$wait_seconds"
              beijing_now="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %z')"
              beijing_date="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
              beijing_hour="$(TZ=Asia/Shanghai date '+%H')"
            fi

            if [ "$beijing_hour" -ge 9 ]; then
              should_send="true"
              reason="first automatic run at or after Beijing 09:00"
            fi

            branch="${GITHUB_REF_NAME:-main}"
            git fetch origin "$branch"
            sent_date=""
            if git cat-file -e "origin/$branch:data/feishu-daily-state.json" 2>/dev/null; then
              sent_date="$(git show "origin/$branch:data/feishu-daily-state.json" | python -c 'import json, sys; print((json.load(sys.stdin).get("last_sent_date") or ""))')"
            fi
            if [ "$sent_date" = "$beijing_date" ]; then
              should_send="false"
              reason="already sent for $beijing_date"
            fi
          fi

          echo "Beijing now: $beijing_now"
          echo "Decision: $should_send ($reason)"
          echo "beijing_date=$beijing_date" >> "$GITHUB_OUTPUT"
          echo "beijing_now=$beijing_now" >> "$GITHUB_OUTPUT"
          echo "should_send=$should_send" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.delivery_guard.outputs.should_send == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        if: steps.delivery_guard.outputs.should_send == 'true' && github.event_name != 'workflow_run'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML
        if: steps.delivery_guard.outputs.should_send == 'true' && github.event_name != 'workflow_run'
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
          fi

      - name: Update data
        if: steps.delivery_guard.outputs.should_send == 'true' && github.event_name != 'workflow_run'
        env:
          EMAIL_DIGEST_ENABLED: ${{ secrets.EMAIL_DIGEST_ENABLED || vars.EMAIL_DIGEST_ENABLED }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          X_API_ENABLED: ${{ secrets.X_API_ENABLED || vars.X_API_ENABLED }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SOCIALDATA_ENABLED: ${{ secrets.SOCIALDATA_ENABLED || vars.SOCIALDATA_ENABLED }}
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          TIKHUB_ENABLED: ${{ secrets.TIKHUB_ENABLED || vars.TIKHUB_ENABLED }}
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || 10 }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 --rss-opml feeds/follow.opml --rss-max-feeds "${RSS_MAX_FEEDS:-10}"
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21
          fi

      - name: Commit data
        if: steps.delivery_guard.outputs.should_send == 'true' && github.event_name != 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update ai news snapshot before feishu daily"
            git push
          fi

      - name: Send Feishu daily brief
        if: steps.delivery_guard.outputs.should_send == 'true'
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: python scripts/send_feishu_daily.py

      - name: Record Feishu delivery
        if: steps.delivery_guard.outputs.should_send == 'true'
        env:
          BEIJING_DATE: ${{ steps.delivery_guard.outputs.beijing_date }}
          BEIJING_NOW: ${{ steps.delivery_guard.outputs.beijing_now }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          branch="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$branch"
          python -c "import json, os, pathlib; p=pathlib.Path('data/feishu-daily-state.json'); p.write_text(json.dumps({'last_sent_date': os.environ['BEIJING_DATE'], 'last_sent_at_beijing': os.environ['BEIJING_NOW'], 'run_id': os.environ['RUN_ID'], 'run_number': os.environ['RUN_NUMBER']}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feishu-daily-state.json
          git commit -m "chore: record feishu daily delivery"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "State push attempt $attempt failed; rebasing and retrying"
            git pull --rebase origin "$branch"
          done
          echo "Failed to record Feishu delivery state after 3 attempts"
          exit 1
